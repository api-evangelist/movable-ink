name: movable — Movable Ink Studio CLI
description: >-
  `movable` is Movable Ink's first-party command-line tool for creating,
  building, serving and deploying Movable Ink Studio applications (the app
  bundles that render personalised content in email, mobile and web). It is a
  developer-workflow CLI for Studio app authors, not a management CLI for the
  Customer Data API — there is no CLI for data ingestion.
