name: Movable Ink API Lifecycle
description: >-
  Versioning, status, and change communication for the Movable Ink platform.
  Movable Ink runs a public Atlassian Statuspage covering Studio, Da Vinci and
  the Customer Data API, and publishes quarterly product announcements. It does
  not publish an API versioning policy, a deprecation policy, sunset headers, or
  an SLA on any public URL.
