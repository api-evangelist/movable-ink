  page_name: Movable Ink
  components:
    - group: Studio
      items: [Web App, Acoustic Campaign, Content Rendering]
    - group: Studio - Integrations
      items: [Weather & Location Services, Analytics, Adobe Campaign Classic]
    - group: Da Vinci
      items: [Web App, Signal, Dynamic Links, Amazon SES]
    - group: Da Vinci - ESP Integrations
      items: [Link Redirect, Active Integrations, Braze, Cheetah Messaging, Data Processing, Analytics, Cordial, Oracle Responsys, SalesForce Marketing Cloud, Zeta]
    - group: (ungrouped)
      items: [Customer Data API, Behavior & Conversion Scripts, Exchange Integrations, Webhooks, Mobile SDK]
  note: >-
    The Customer Data API, Webhooks and Mobile SDK are named as first-class
    operational components on the status page — useful corroboration that these
    are supported surfaces even though their reference documentation is
    customer-gated.
versioning:
  api:
    scheme: none published
    detail: >-
      The Customer Data API endpoint is unversioned:
      POST https://collector.movableink-dmz.com/behavioral/{endpoint_key}.
      No version path segment, no version header, no version query parameter is
      documented by Movable Ink or by any downstream connector.
  mobile_sdk:
    scheme: semver
    current_major: 'v3'
    detail: >-
      The mobile SDK family is versioned semantically and released in lockstep
      across platforms (iOS CocoaPods 3.0.0, Android com.movableink.sdk:inked
      2.0.0, React Native 3.0.1, Cordova 2.2.0, Flutter 3.1.1). Major versions
      carry documented behavioral change (v2 added Tactics and Da Vinci events;
      v3 added Da Vinci push-notification open analytics).
    source: https://sdk-mobile.movableink.com/changelog
deprecation:
  policy_published: false
  sunset_header: not observed
  deprecation_header: not observed
  detail: >-
    No deprecation or sunset policy is published on any public Movable Ink URL,
    and no RFC 8594 Sunset/Deprecation headers were observed on the collector
    responses. Breaking change communication runs through the Client Experience
    team and the customer-gated support centre.
sla:
  published: false
  detail: >-
    No public SLA or uptime commitment. Availability is one of the SOC 2 Type II
    trust service criteria Movable Ink is audited against, but the report is
    only available via the Trust Center on request.
