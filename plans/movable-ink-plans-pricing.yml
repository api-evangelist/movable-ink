notes:
  - >-
    https://movableink.com/pricing returns HTTP 404 — the marketing site
    (Webflow) has no pricing route at all. Neither do /contact, /demo or
    /request-a-demo; the demo request is a form embedded in page templates.
  - >-
    app.movableink.com is a login, not a signup: it 302s anonymous requests to
    the auth.movableink.com Auth0 tenant. There is no public tenant creation
    flow, so a developer cannot obtain a Customer Data API endpoint key or the
    Studio/Da Vinci app without an executed contract.
  - >-
    Third-party procurement marketplaces (Vendr, Capchase, GetApp, OMR) list
    negotiated ranges for Movable Ink contracts. Those are buyer-reported
    figures, not provider-published prices, so none of them are recorded here
    as plan data.
  - >-
    Because nothing is published, no rate card, quota, entitlement or overage
    can be attached to a tier. This is a plan_count of zero by the provider's
    own choice, not a gap in the harvest.
