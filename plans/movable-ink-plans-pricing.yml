name: Movable Ink Plans and Pricing
description: >-
  Movable Ink publishes no pricing page, no plan tiers, no quotas and no
  published overage rates on any of its own public hosts. Every commercial
  motion runs through a sales conversation — the site's calls to action are
  "Get a demo" and "Contact us", and the Customer Data API endpoint key plus
  its Basic-auth credentials are issued by a Movable Ink Solutions Architect
  during onboarding rather than self-served from an account. There is no
  self-serve signup, no free tier, and no trial that a developer can start
  without talking to sales.
