x-coverage:
  state: covered
  detail: >-
    Real public artifacts were harvested (llms.txt, OIDC + OAuth AS metadata, JWKS,
    Trust Center certifications, status page, package registries, plans, rate limits,
    webhook surface, client-side components), but Movable Ink's own API reference sits
    on support.movableink.com behind a Cloudflare interstitial and an active-tenant
    requirement, so no machine-readable contract exists for the Customer Data API.
    Contract re-discovery on 2026-08-12 re-ran the full hunt — OpenAPI/Swagger paths on
    the collector and docs hosts, agent cards at both well-known paths on six hosts,
    DNS for mcp./api./docs./developer. subdomains, and the movableink GitHub org —
    and every probe missed.
  evidence:
  - url: https://support.movableink.com/api/v2/help_center/en-us/categories.json
    status: 401
  - url: https://collector.movableink-dmz.com/openapi.json
    status: 404
  - url: https://support.movableink.com/hc/en-us
    status: 403
  - url: https://collector.movableink-dmz.com/.well-known/agent-card.json
    status: 404
  checked: '2026-08-12'
