aid: movable-ink
name: Movable Ink
description: >-
  Movable Ink is a New York-headquartered marketing technology company that turns
  customer data into personalized content across email, mobile and web. Its two
  products are Studio, which generates composite images and interactive content
  at the moment a message is opened, and Da Vinci, an AI decisioning layer that
  chooses what content each customer sees. The integration surface is a
  write-only Customer Data API that streams behavioral events into Studio, a
  family of native and wrapper mobile SDKs (iOS, Android, React Native, Cordova,
  Flutter, Expo), a Studio app toolchain built around the `movable` CLI and the
  cropduster library, and dozens of ESP/CDP connectors. API reference material is
  customer-gated; no OpenAPI is published.
