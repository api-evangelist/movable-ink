apis:
- aid: movable-ink:customer-data-api
  name: Movable Ink Customer Data API
  description: >-
    A write-only HTTP collector that ingests customer behavioral events in real
    time so Movable Ink Studio can use them for targeting and content generation.
    Callers POST Segment-shaped JSON events (type, event, user_id or
    anonymous_id, timestamp, timezone, properties) to a per-tenant endpoint URL
    with the tenant key in the path, authenticated with HTTP Basic credentials
    issued by the Movable Ink Solutions team. The API is deliberately
    schema-flexible: field names are mapped per customer at onboarding rather
    than fixed by a published contract.
  humanURL: https://movableink.com/studio
  baseURL: https://collector.movableink-dmz.com
  tags:
  - Customer Data
  - Events
  - Personalization
  - Marketing
  properties:
  - type: Authentication
    url: authentication/movable-ink-authentication.yml
  - type: Conventions
    url: conventions/movable-ink-conventions.yml
  - type: ErrorCatalog
    url: errors/movable-ink-problem-types.yml
- aid: movable-ink:identity
  name: Movable Ink Platform Identity (OpenID Connect)
  description: >-
    The OpenID Connect provider that fronts the Movable Ink Studio and Da Vinci
    web application at app.movableink.com. It publishes a full OIDC discovery
    document and an RFC 8414 authorization-server metadata document anonymously,
    advertising authorization, token, userinfo, revocation, device-code, dynamic
    client registration and MFA challenge endpoints, PKCE (S256), and a JWKS.
  humanURL: https://app.movableink.com/
  baseURL: https://auth.movableink.com
  tags:
  - Authentication
  - OpenID Connect
  - OAuth
  properties:
  - type: OpenIDConnect
    url: well-known/movable-ink-openid-configuration.json
  - type: OAuthScopes
    url: scopes/movable-ink-scopes.yml
  - type: Authentication
    url: authentication/movable-ink-authentication.yml
