misses:
  security_txt: >-
    No RFC 9116 security.txt is served on any Movable Ink host. Movable Ink does
    publish security contacts (security@movableink.com for reports,
    infosec@movableink.com for security and compliance inquiries) on
    https://movableink.com/privacy-security-and-compliance — the contacts exist,
    the machine-readable file does not.
  api_catalog: No RFC 9727 /.well-known/api-catalog on any host.
  agent_card: >-
    No A2A agent card at either the canonical (/.well-known/agent-card.json) or
    the legacy (/.well-known/agent.json) path, on any of the six hosts, re-probed
    2026-08-12. The only 200s came from the exchange.movableink.com Webflow
    catch-all serving HTML, which is not a card. No a2a/ artifact is written —
    an agent card is search-only and must never be authored on a provider's behalf.
  mcp: >-
    No hosted MCP server. mcp.movableink.com and api.movableink.com do not resolve
    in DNS, no MCP endpoint is documented, and no /.well-known/oauth-protected-resource
    is served. With no OpenAPI to derive candidate tools from, no mcp/ artifact
    is written.
